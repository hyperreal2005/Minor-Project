[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgetcheck"
version = "0.1.0"
description = "Audit disagreement, reversibility and audit validity in approximate machine unlearning"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]
dashboard = ["streamlit>=1.30", "matplotlib>=3.7", "seaborn>=0.13"]
stats = ["statsmodels>=0.14"]

[project.scripts]
forgetcheck = "forgetcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgetcheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
  "slow: real training runs; select with -m slow",
  "requires_data: needs the real CIFAR-10 bundle on disk",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
